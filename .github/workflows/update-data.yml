name: Update SÚKL Data
on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sukl-data-update
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run data:update
      - run: npm run build:widget
      - run: npm test
      - run: npm run build
      - name: Create or update the data pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/sukl-data
          delete-branch: true
          commit-message: 'chore: refresh verified SÚKL data'
          title: 'Aktualizace katalogu, ATC, lékáren a úhrad SÚKL'
          body: 'Aktuální oficiální zdroje a otisky jsou v metadatech balíčku. Import proběhl až po kontrole schématu, počtů a referencí; testy a sestavení prošly. Před sloučením zkontrolujte změny dat.'
          add-paths: data/*.json
